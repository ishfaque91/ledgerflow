<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Subcollection Listener Test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  button { padding: 10px 20px; font-size: 16px; margin: 10px 0; cursor: pointer; }
  #result { white-space: pre-wrap; background: #f0f0f0; padding: 15px; border-radius: 6px; margin-top: 15px; font-family: monospace; font-size: 13px; min-height: 40px; }
  input { padding: 8px; font-size: 14px; width: 100%; margin: 5px 0; box-sizing: border-box; }
</style>
</head>
<body>

<h2>Subcollection Listener Test</h2>
<p>Tests companies/{id}/accounts — the exact subcollection pattern the real app watches, governed by a different rule than what we've tested so far.</p>

<label>Your real email:</label>
<input type="email" id="test-email" placeholder="you@business.com">
<label>Your real password:</label>
<input type="password" id="test-password" placeholder="Your password">

<button id="run-btn">Run Test</button>

<div id="result">Click the button above to start.</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script>
window.addEventListener('load', function () {
    var resultBox = document.getElementById('result');
    function log(msg) { resultBox.textContent += '\n' + msg; }

    document.getElementById('run-btn').addEventListener('click', function () {
        resultBox.textContent = 'Starting at ' + new Date().toLocaleTimeString() + '...';

        var firebaseConfig = {
            apiKey: "AIzaSyCpQtMlAB9mcoFdVBpSKMVszRkGrLWbl30",
            authDomain: "ledgerflow-df765.firebaseapp.com",
            projectId: "ledgerflow-df765",
            storageBucket: "ledgerflow-df765.firebasestorage.app",
            messagingSenderId: "467557800619",
            appId: "1:467557800619:web:eda2eeb95c36162ae2f5ee"
        };
        if (!firebase.apps || firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);

        var auth = firebase.auth();
        var db = firebase.firestore();
        var email = document.getElementById('test-email').value;
        var password = document.getElementById('test-password').value;

        log('Signing in...');
        auth.signInWithEmailAndPassword(email, password).then(function (cred) {
            log('✅ Signed in.');
            return db.collection('users').doc(cred.user.uid).get().then(function (userDoc) {
                var companyId = userDoc.data().companyId;
                log('✅ companyId: ' + companyId);

                var collections = ['accounts', 'items', 'users', 'rights', 'invoices', 'vouchers', 'accountLedger', 'loadLedger', 'itemLedger', 'editLog'];
                var index = 0;

                function testNext() {
                    if (index >= collections.length) {
                        log('\n🎉 ALL subcollections tested successfully!');
                        return;
                    }
                    var key = collections[index];
                    index++;

                    log('\nTesting live listener on companies/' + companyId + '/' + key + '...');
                    var done = false;
                    var timeoutId = setTimeout(function () {
                        if (!done) {
                            log('❌ TIMED OUT on "' + key + '" after 8s — THIS is the one that hangs.');
                        }
                        // Move on to test the rest anyway, so we get the full picture
                        testNext();
                    }, 8000);

                    var unsub = db.collection('companies').doc(companyId).collection(key).onSnapshot(function (snap) {
                        if (!done) {
                            done = true;
                            clearTimeout(timeoutId);
                            log('✅ "' + key + '" OK (' + snap.size + ' documents)');
                            unsub();
                            testNext();
                        }
                    }, function (err) {
                        if (!done) {
                            done = true;
                            clearTimeout(timeoutId);
                            log('❌ "' + key + '" FAILED: ' + err.code + ' - ' + err.message);
                            testNext();
                        }
                    });
                }

                testNext();
            });
        }).catch(function (err) {
            log('❌ FAILED: ' + (err.code || '') + ' - ' + err.message);
        });
    });
});
</script>
</body>
</html>
