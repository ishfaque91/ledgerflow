<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Firestore Real-Time Listener Test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  button { padding: 10px 20px; font-size: 16px; margin: 10px 0; cursor: pointer; }
  #result { white-space: pre-wrap; background: #f0f0f0; padding: 15px; border-radius: 6px; margin-top: 15px; font-family: monospace; font-size: 13px; min-height: 40px; }
  input { padding: 8px; font-size: 14px; width: 100%; margin: 5px 0; box-sizing: border-box; }
</style>
</head>
<body>

<h2>Firestore Real-Time Listener Test</h2>
<p>Use your REAL LedgerFlow email and password below. This separately tests (1) a normal one-time read and (2) a live "listen for changes" connection — the second one is what we suspect is actually hanging.</p>

<label>Your real email:</label>
<input type="email" id="test-email" placeholder="you@business.com">
<label>Your real password:</label>
<input type="password" id="test-password" placeholder="Your password">

<button id="run-btn">Run Test</button>

<div id="result">Click the button above to start.</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script>
window.addEventListener('load', function () {
    var resultBox = document.getElementById('result');
    function log(msg) { resultBox.textContent += '\n' + msg; }

    document.getElementById('run-btn').addEventListener('click', function () {
        resultBox.textContent = 'Starting at ' + new Date().toLocaleTimeString() + '...';

        var firebaseConfig = {
            apiKey: "AIzaSyCpQtMlAB9mcoFdVBpSKMVszRkGrLWbl30",
            authDomain: "ledgerflow-df765.firebaseapp.com",
            projectId: "ledgerflow-df765",
            storageBucket: "ledgerflow-df765.firebasestorage.app",
            messagingSenderId: "467557800619",
            appId: "1:467557800619:web:eda2eeb95c36162ae2f5ee"
        };
        if (!firebase.apps || firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);

        var auth = firebase.auth();
        var db = firebase.firestore();

        var email = document.getElementById('test-email').value;
        var password = document.getElementById('test-password').value;

        log('Step 1: Signing in with your real credentials...');

        auth.signInWithEmailAndPassword(email, password).then(function (cred) {
            log('✅ Step 1 PASSED — signed in as ' + cred.user.email);
            log('\nStep 2: Trying a normal ONE-TIME read of your user record...');

            var step2Done = false;
            setTimeout(function () {
                if (!step2Done) log('❌ Step 2 TIMED OUT after 10s — even a plain one-time read is hanging.');
            }, 10000);

            return db.collection('users').doc(cred.user.uid).get().then(function (doc) {
                step2Done = true;
                if (doc.exists) {
                    log('✅ Step 2 PASSED — one-time read worked fine. Data: ' + JSON.stringify(doc.data()));
                } else {
                    log('⚠️ Step 2: read succeeded but no document found for this user.');
                }

                log('\nStep 3: Trying a LIVE listener (onSnapshot) on the same document...');
                var step3Done = false;
                setTimeout(function () {
                    if (!step3Done) {
                        log('❌ Step 3 TIMED OUT after 10s — the live listener specifically is hanging.');
                        log('This confirms the problem is Firestore\'s real-time "watch" connection specifically, not basic reads.');
                    }
                }, 10000);

                var unsubscribe = db.collection('users').doc(cred.user.uid).onSnapshot(function (snap) {
                    if (!step3Done) {
                        step3Done = true;
                        log('✅ Step 3 PASSED — live listener connected and received data!');
                        log('Everything works — if the real app still hangs, the issue is in the app\'s own code logic, not Firebase connectivity.');
                        unsubscribe();
                    }
                }, function (err) {
                    step3Done = true;
                    log('❌ Step 3 FAILED with an error: ' + err.code + ' - ' + err.message);
                });
            });
        }).catch(function (err) {
            log('❌ Step 1 FAILED: ' + err.code + ' - ' + err.message);
            log('(Double check the email/password are correct)');
        });
    });
});
</script>
</body>
</html>
